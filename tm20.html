<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href=tm20.css>
</head>
<body>
    <h1>Thư viện ảnh tương tác</h1>

  <div id="image">
    Hê chuột hoặc dùng phím Tab để chọn ảnh bên dưới.
  </div>

  <img class="preview" 
       alt="Cánh đồng hoa hướng dương dưới ánh nắng" 
       src="https://picsum.photos/id/10/500/300" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)" 
       onblur="unDo()">

  <img class="preview" 
       alt="Dòng sông chảy qua thung lũng núi tuyết" 
       src="https://picsum.photos/id/11/500/300" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)" 
       onblur="unDo()">

  <img class="preview" 
       alt="Bãi biển hoang sơ với làn nước xanh trong" 
       src="https://picsum.photos/id/12/500/300" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)" 
       onblur="unDo()">

  <img class="preview" 
       alt="Rừng cây mùa thu lá vàng rực rỡ" 
       src="https://picsum.photos/id/13/500/300" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)" 
       onblur="unDo()">

  <img class="preview" 
       alt="Thành phố lung linh đèn về đêm" 
       src="https://picsum.photos/id/15/500/300" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)" 
       onblur="unDo()">

  <script>
    // Hàm cập nhật ảnh lớn khi di chuột hoặc focus
    function upDate(previewPic) {
      const displayDiv = document.getElementById('image');
      displayDiv.style.backgroundImage = `url('${previewPic.src}')`;
      displayDiv.innerHTML = previewPic.alt;
    }

    function unDo() {
      const displayDiv = document.getElementById('image');
      displayDiv.style.backgroundImage = "url('')";
      displayDiv.innerHTML = "Hê chuột hoặc dùng phím Tab để chọn ảnh bên dưới.";
    }

    function initializeGallery() {
      console.log("Trang web đã tải xong - Hàm initializeGallery bắt đầu chạy.");
      
      const images = document.querySelectorAll('.preview');
      for (let i = 0; i < images.length; i++) {
        images[i].setAttribute('tabindex', '0');
        console.log(`Đã thêm tabindex="0" cho hình ảnh thứ ${i + 1}`);
      }
    }

    // Thêm sự kiện onload cho trang web
    window.onload = initializeGallery;
  </script>
</body>
</html>
