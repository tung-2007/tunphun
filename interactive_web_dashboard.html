<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng HTML Mẫu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-indigo-500/10 text-indigo-400 rounded-xl mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Xin Chào World!</h1>
      <p class="text-slate-400 text-sm">Đây là một mẫu file HTML hoàn chỉnh tích hợp Tailwind CSS và JS tương tác.</p>
    </div>

    <!-- Interactive Card -->
    <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50 text-center space-y-3">
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Số Lần Nhấp</p>
      <div id="counter" class="text-4xl font-extrabold text-indigo-400">0</div>
      <div class="flex gap-2 justify-center pt-2">
        <button id="decrement" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 active:scale-95 transition-all rounded-lg font-medium text-sm">Giảm</button>
        <button id="reset" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all rounded-lg font-medium text-sm text-slate-400">Đặt lại</button>
        <button id="increment" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all rounded-lg font-medium text-sm text-white shadow-lg shadow-indigo-500/20">Tăng</button>
      </div>
    </div>

    <!-- Input Form -->
    <div class="space-y-3">
      <label for="username" class="block text-xs font-medium text-slate-300">Nhập tên của bạn</label>
      <div class="flex gap-2">
        <input type="text" id="username" placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
        <button id="greetBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-sm font-medium rounded-lg transition-colors whitespace-nowrap">Chào</button>
      </div>
      <p id="greetingText" class="text-xs text-indigo-300 min-h-[1.25rem]"></p>
    </div>

    <!-- Footer -->
    <div class="pt-4 border-t border-slate-700/50 text-center text-xs text-slate-500">
      Được tạo bởi Gemini • HTML5 / Tailwind CSS
    </div>
  </div>

  <script>
    // Counter Logic
    let count = 0;
    const counterEl = document.getElementById('counter');
    const incrementBtn = document.getElementById('increment');
    const decrementBtn = document.getElementById('decrement');
    const resetBtn = document.getElementById('reset');

    incrementBtn.addEventListener('click', () => {
      count++;
      counterEl.textContent = count;
    });

    decrementBtn.addEventListener('click', () => {
      count--;
      counterEl.textContent = count;
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      counterEl.textContent = count;
    });

    // Greeting Logic
    const usernameInput = document.getElementById('username');
    const greetBtn = document.getElementById('greetBtn');
    const greetingText = document.getElementById('greetingText');

    greetBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name) {
        greetingText.textContent = `Xin chào ${name}, chúc bạn một ngày tốt lành! ✨`;
      } else {
        greetingText.textContent = 'Vui lòng nhập tên của bạn trước nhé.';
      }
    });
  </script>
</body>
</html>
