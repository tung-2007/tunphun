<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án cuối cùng: Thư viện ảnh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Thư viện ảnh thiên nhiên</h1>
        <p>Cuộn xuống để xem các bức ảnh. Giao diện này sẽ phản hồi theo kích thước màn hình và cài đặt hệ thống của bạn.</p>
    </header>

    <main class="gallery">
        <!-- Hình ảnh 1 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744626753-edaebc2b3638?w=500&q=80" alt="Phong cảnh thiên nhiên hùng vĩ của dãy núi">
            <p>Một góc nhìn tuyệt đẹp về dãy núi và bầu trời trong xanh vào lúc bình minh.</p>
        </figure>

        <!-- Hình ảnh 2 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=500&q=80" alt="Bờ biển hoàng hôn với những con sóng nhẹ">
            <p>Cảnh hoàng hôn lãng mạn trên bãi biển yên bình với những con sóng vỗ rì rào.</p>
        </figure>

        <!-- Hình ảnh 3 (Đã đảm bảo có thẻ alt để không bị báo lỗi) -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500&q=80" alt="Rừng cây mùa thu với lá vàng rơi rải rác">
            <p>Mùa thu mang theo sắc vàng ươm trên những tán cây rậm rạp.</p>
        </figure>

        <!-- Hình ảnh 4 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=500&q=80" alt="Con đường mòn bí ẩn trong khu rừng rậm rạp">
            <p>Khám phá con đường mòn bí ẩn sâu trong khu rừng nguyên sinh tĩnh lặng.</p>
        </figure>

        <!-- Hình ảnh 5 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=500&q=80" alt="Cảnh tuyết rơi phủ trắng xóa ngọn núi">
            <p>Mùa đông lạnh giá với lớp tuyết trắng bao phủ hoàn toàn đỉnh núi cao.</p>
        </figure>

        <!-- Hình ảnh 6 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=500&q=80" alt="Cây cầu treo mộc mạc bắc qua con suối nhỏ">
            <p>Chiếc cầu treo mộc mạc nối liền hai bờ suối róc rách trong rừng sâu.</p>
        </figure>
    </main>
</body>
</html>
