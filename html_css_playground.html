<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học HTML & CSS - Bài Học & Sân Tập Tương Tác</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        code, textarea, .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.6);
        }
        /* Smooth transitions */
        .transition-all-custom {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-full flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-800 border-b border-gray-700 h-14 flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <button id="toggle-sidebar-btn" class="md:hidden text-gray-400 hover:text-white p-1 rounded focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="bg-gradient-to-tr from-brand-600 to-indigo-500 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-code text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base leading-tight text-white">Học HTML & CSS Tương Tác</h1>
                    <p class="text-xs text-gray-400 hidden sm:block">Sân tập lập trình dành cho người mới bắt đầu</p>
                </div>
            </div>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <div class="hidden sm:flex items-center bg-gray-700 text-xs text-gray-300 px-3 py-1.5 rounded-full border border-gray-600">
                <i class="fa-solid fa-trophy text-amber-400 mr-1.5"></i>
                <span>Tiến độ: <strong id="progress-text" class="text-white">0/5</strong> bài học</span>
            </div>

            <button id="btn-copy" title="Sao chép toàn bộ mã" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs font-medium rounded-md flex items-center gap-1.5 transition">
                <i class="fa-regular fa-copy"></i>
                <span class="hidden sm:inline">Sao chép</span>
            </button>
            
            <button id="btn-reset" title="Khôi phục mã ban đầu" class="px-3 py-1.5 bg-gray-700 hover:bg-rose-900/60 hover:text-rose-200 text-gray-200 text-xs font-medium rounded-md flex items-center gap-1.5 transition border border-transparent hover:border-rose-700/50">
                <i class="fa-solid fa-rotate-left"></i>
                <span class="hidden sm:inline">Đặt lại</span>
            </button>

            <button id="btn-download" title="Tải về file HTML" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-md flex items-center gap-1.5 transition shadow-sm">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">Tải về</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Sidebar Navigation (Lessons) -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 w-80 bg-gray-800 border-r border-gray-700 flex flex-col z-10 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out shrink-0">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/80 backdrop-blur">
                <h2 class="font-semibold text-sm uppercase tracking-wider text-gray-400 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-brand-500"></i> Danh Sách Bài Học
                </h2>
                <button id="close-sidebar-btn" class="md:hidden text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Lessons List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2" id="lessons-list">
                <!-- Dynamically generated lessons -->
            </div>

            <!-- Sidebar Footer / Target Card -->
            <div class="p-4 border-t border-gray-700 bg-gray-850">
                <div class="p-3 bg-gray-900/70 rounded-lg border border-gray-700">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-semibold text-gray-300">Mục tiêu bài tập</span>
                        <span id="lesson-status-badge" class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-medium">Chưa xong</span>
                    </div>
                    <p id="lesson-task-desc" class="text-xs text-gray-400 leading-relaxed">
                        Đang tải nhiệm vụ...
                    </p>
                    <button id="btn-mark-complete" class="mt-2.5 w-full py-1.5 bg-gray-800 hover:bg-emerald-600 text-gray-300 hover:text-white text-xs font-medium rounded transition flex items-center justify-center gap-1 border border-gray-600 hover:border-emerald-500">
                        <i class="fa-solid fa-check"></i> Đánh dấu hoàn thành
                    </button>
                </div>
            </div>
        </aside>

        <!-- Overlay for Mobile Sidebar -->
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-0 md:hidden"></div>

        <!-- Main Content Area: Editor + Preview split view -->
        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-gray-950">
            
            <!-- Code Editor Column -->
            <section class="flex-1 flex flex-col h-1/2 lg:h-full border-b lg:border-b-0 lg:border-r border-gray-800 min-w-0">
                
                <!-- Editor Header & Tabs -->
                <div class="bg-gray-850 border-b border-gray-800 flex items-center justify-between px-3 h-10 shrink-0">
                    <div class="flex space-x-1">
                        <button id="tab-html" class="px-3 py-1.5 text-xs font-semibold rounded-t-md bg-gray-900 text-brand-400 border-t-2 border-brand-500 flex items-center gap-1.5 transition">
                            <i class="fa-brands fa-html5 text-orange-500"></i> HTML
                        </button>
                        <button id="tab-css" class="px-3 py-1.5 text-xs font-semibold rounded-t-md text-gray-400 hover:text-gray-200 flex items-center gap-1.5 transition">
                            <i class="fa-brands fa-css3-alt text-blue-500"></i> CSS
                        </button>
                    </div>

                    <div class="flex items-center space-x-2 text-xs text-gray-400">
                        <span id="editor-char-count" class="hidden sm:inline font-mono">0 ký tự</span>
                        <div class="h-3 w-px bg-gray-700 hidden sm:block"></div>
                        <span class="flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            Tự động xem trước
                        </span>
                    </div>
                </div>

                <!-- Textarea Editors Wrapper -->
                <div class="flex-1 relative overflow-hidden bg-gray-900">
                    <!-- HTML Editor -->
                    <textarea id="editor-html" 
                        class="w-full h-full p-4 bg-gray-900 text-gray-100 font-mono text-sm leading-relaxed resize-none focus:outline-none border-0 selection:bg-brand-900 selection:text-brand-100 whitespace-pre" 
                        spellcheck="false" 
                        placeholder="Nhập mã HTML vào đây..."></textarea>
                    
                    <!-- CSS Editor -->
                    <textarea id="editor-css" 
                        class="hidden w-full h-full p-4 bg-gray-900 text-gray-100 font-mono text-sm leading-relaxed resize-none focus:outline-none border-0 selection:bg-brand-900 selection:text-brand-100 whitespace-pre" 
                        spellcheck="false" 
                        placeholder="Nhập mã CSS vào đây..."></textarea>
                </div>
            </section>

            <!-- Preview Pane Column -->
            <section class="flex-1 flex flex-col h-1/2 lg:h-full min-w-0 bg-white">
                
                <!-- Preview Header Bar -->
                <div class="bg-gray-800 border-b border-gray-700 flex items-center justify-between px-3 h-10 shrink-0">
                    <div class="flex items-center space-x-2">
                        <span class="flex space-x-1.5">
                            <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                            <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                        </span>
                        <span class="text-xs font-semibold text-gray-300 ml-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-desktop text-gray-400"></i> Xem Trực Tiếp (Live Preview)
                        </span>
                    </div>

                    <div class="flex items-center space-x-2">
                        <button id="btn-refresh-preview" title="Làm mới xem trước" class="p-1 text-gray-400 hover:text-white rounded transition">
                            <i class="fa-solid fa-arrows-rotate text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Preview Iframe -->
                <div class="flex-1 relative bg-white">
                    <iframe id="preview-iframe" class="w-full h-full border-0 bg-white" title="Trình xem trước kết quả"></iframe>
                </div>
            </section>

        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2.5 rounded-lg shadow-xl border border-gray-700 flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg" class="text-xs font-medium">Thông báo</span>
    </div>

    <!-- Application Logic Script -->
    <script>
        // Lessons Dataset
        const lessons = [
            {
                id: 1,
                title: "Bài 1: Cấu trúc HTML cơ bản",
                subtitle: "Tìm hiểu thẻ HTML, head, body, h1 và p",
                description: "HTML (HyperText Markup Language) là ngôn ngữ đánh dấu dùng để dựng khung cấu trúc cho trang web. Mọi trang web đều bắt đầu từ các thẻ tiêu chuẩn.",
                task: "Hãy đổi tiêu đề <h1> thành tên của bạn và viết một câu giới thiệu ngắn trong thẻ <p>.",

                css: `/* CSS nâng cao sẽ học ở Bài 5 */`

                html: `<div style="font-family: sans-serif; padding: 20px; max-width: 500px;">

  <p>Hãy thử kết hợp <strong><em>vừa đậm vừa nghiêng</em></strong> xem sao nhé!</p>

                css: `/* Thêm viền nhẹ cho đẹp mắt */
div {
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background-color: #f9fafb;

            },
            {
                id: 3,
                title: "Bài 3: Hình ảnh & Liên kết",
                subtitle: "Thêm ảnh <img> và liên kết <a>",
                description: "Liên kết giúp kết nối các trang web (thẻ `<a>` với thuộc tính `href`), trong khi ảnh (thẻ `<img>` với `src`) làm cho trang web trở nên sống động.",
                task: "Thay đổi thuộc tính `href` hoặc `src` của ảnh. Thử thay đổi chiều rộng `width` của ảnh thành `250px`.",
                html: `<div style="font-family: sans-serif; padding: 20px; text-align: center;">
  <h2>Bộ Triết Lý Lập Trình</h2>

  </p>

                css: ``
            },
            {
                id: 4,
                title: "Bài 4: Danh sách & Bảng dữ liệu",
                subtitle: "Tạo danh sách <ul> <ol> và bảng <table>",
                description: "Danh sách dạng chấm (<ul>) hoặc đánh số (<ol>) giúp sắp xếp thông tin ngăn nắp. Bảng (<table>, <tr>, <td>, <th>) dùng để hiển thị dữ liệu dạng cột và hàng.",
                task: "Thêm một dòng mới vào bảng (thêm 1 thẻ <tr> chứa 2 thẻ <td>) đại diện cho món ăn thứ 3 bạn yêu thích.",
                html: `<div style="font-family: sans-serif; padding: 20px;">

      </tr>
      <tr>
        <td>JavaScript Thực Chiến</td>
        <td>Có Phí</td>
      </tr>
    </tbody>
  </table>
</div>`,
                css: `/* Trang trí cho Bảng */

            },
            {
                id: 5,
                title: "Bài 5: Giới thiệu CSS cơ bản",

                description: "CSS (Cascading Style Sheets) quyết định vẻ đẹp của trang web. Bạn có thể chỉnh màu sắc (color), màu nền (background-color), căn chỉnh khoảng cách (padding/margin) và tạo góc bo tròn (border-radius).",
                task: "Hãy đổi màu `background` của `.card` thành màu bạn thích (ví dụ `#ec4899`) và chỉnh `border-radius` thành `20px`.",
                html: `<div class="card">

  <button class="card-btn">Khám Phá Ngay</button>
</div>`,
                css: `body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f3f4f6;
  display: flex;
  justify-content: center;

            }
        ];

        // App State
        let currentLessonIndex = 0;
        let activeTab = 'html'; // 'html' or 'css'
        let completedLessons = new Set(JSON.parse(localStorage.getItem('completed_lessons') || '[]'));

        // DOM Elements
        const htmlEditor = document.getElementById('editor-html');
        const cssEditor = document.getElementById('editor-css');
        const previewIframe = document.getElementById('preview-iframe');
        const lessonsListContainer = document.getElementById('lessons-list');
        const tabHtml = document.getElementById('tab-html');
        const tabCss = document.getElementById('tab-css');
        const taskDesc = document.getElementById('lesson-task-desc');
        const progressText = document.getElementById('progress-text');
        const lessonStatusBadge = document.getElementById('lesson-status-badge');
        const btnMarkComplete = document.getElementById('btn-mark-complete');
        const charCount = document.getElementById('editor-char-count');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        // Initialize App
        function initApp() {
            renderLessonsList();
            loadLesson(0);
            setupEventListeners();
            updateProgressUI();
        }

        // Render Lessons Sidebar Items
        function renderLessonsList() {
            lessonsListContainer.innerHTML = '';
            lessons.forEach((lesson, index) => {
                const isCompleted = completedLessons.has(lesson.id);
                const isActive = index === currentLessonIndex;

                const card = document.createElement('div');
                card.className = `p-3 rounded-lg cursor-pointer transition border ${
                    isActive 
                        ? 'bg-brand-900/40 border-brand-500/80 text-white' 
                        : 'bg-gray-850 hover:bg-gray-750 border-gray-700/60 text-gray-300'
                }`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="font-medium text-xs sm:text-sm ${isActive ? 'text-brand-300' : 'text-gray-200'}">
                            ${lesson.title}
                        </div>
                        ${isCompleted 
                            ? '<span class="text-emerald-400 text-xs shrink-0"><i class="fa-solid fa-circle-check"></i></span>' 
                            : '<span class="text-gray-600 text-xs shrink-0"><i class="fa-regular fa-circle"></i></span>'}
                    </div>
                    <p class="text-[11px] text-gray-400 mt-1 line-clamp-1">${lesson.subtitle}</p>
                `;

                card.addEventListener('click', () => {
                    loadLesson(index);
                    closeMobileSidebar();
                });

                lessonsListContainer.appendChild(card);
            });
        }

        // Load Selected Lesson
        function loadLesson(index) {
            currentLessonIndex = index;
            const lesson = lessons[index];

            // Set editor content
            htmlEditor.value = lesson.html;
            cssEditor.value = lesson.css;

            // Set Task Description
            taskDesc.textContent = lesson.task;

            // Update tab highlighting & render list
            renderLessonsList();
            updateStatusBadge();
            updateLivePreview();
            updateCharCount();
        }

        // Real-time Live Preview Refresh
        function updateLivePreview() {
            const html = htmlEditor.value;
            const css = cssEditor.value;

            const combinedDoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        ${css}
                    </style>
                </head>
                <body>
                    ${html}
                </body>
                </html>
            `;

            const iframeDoc = previewIframe.contentDocument || previewIframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(combinedDoc);
            iframeDoc.close();
        }

        // Tab Switching Logic
        function switchTab(tab) {
            activeTab = tab;
            if (tab === 'html') {
                htmlEditor.classList.remove('hidden');
                cssEditor.classList.add('hidden');
                
                tabHtml.className = 'px-3 py-1.5 text-xs font-semibold rounded-t-md bg-gray-900 text-brand-400 border-t-2 border-brand-500 flex items-center gap-1.5 transition';
                tabCss.className = 'px-3 py-1.5 text-xs font-semibold rounded-t-md text-gray-400 hover:text-gray-200 flex items-center gap-1.5 transition';
            } else {
                htmlEditor.classList.add('hidden');
                cssEditor.classList.remove('hidden');

                tabCss.className = 'px-3 py-1.5 text-xs font-semibold rounded-t-md bg-gray-900 text-brand-400 border-t-2 border-brand-500 flex items-center gap-1.5 transition';
                tabHtml.className = 'px-3 py-1.5 text-xs font-semibold rounded-t-md text-gray-400 hover:text-gray-200 flex items-center gap-1.5 transition';
            }
            updateCharCount();
        }

        // Update Editor Character Count
        function updateCharCount() {
            const activeEditor = activeTab === 'html' ? htmlEditor : cssEditor;
            charCount.textContent = `${activeEditor.value.length} ký tự`;
        }

        // Status & Progress Updates
        function updateStatusBadge() {
            const lesson = lessons[currentLessonIndex];
            const isDone = completedLessons.has(lesson.id);

            if (isDone) {
                lessonStatusBadge.className = 'text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-medium';
                lessonStatusBadge.textContent = 'Hoàn thành';
                btnMarkComplete.innerHTML = '<i class="fa-solid fa-arrow-rotate-left"></i> Đánh dấu chưa xong';
                btnMarkComplete.className = 'mt-2.5 w-full py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-medium rounded transition flex items-center justify-center gap-1 border border-gray-600';
            } else {
                lessonStatusBadge.className = 'text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-medium';
                lessonStatusBadge.textContent = 'Chưa xong';
                btnMarkComplete.innerHTML = '<i class="fa-solid fa-check"></i> Đánh dấu hoàn thành';
                btnMarkComplete.className = 'mt-2.5 w-full py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-medium rounded transition flex items-center justify-center gap-1 border border-emerald-500';
            }
        }

        function toggleCompleteCurrentLesson() {
            const currentId = lessons[currentLessonIndex].id;
            if (completedLessons.has(currentId)) {
                completedLessons.delete(currentId);
                showToast('Đã đánh dấu chưa hoàn thành bài này', 'info');
            } else {
                completedLessons.add(currentId);
                showToast('Tuyệt vời! Bạn đã hoàn thành bài học!', 'success');
            }
            localStorage.setItem('completed_lessons', JSON.stringify([...completedLessons]));
            updateProgressUI();
            updateStatusBadge();
            renderLessonsList();
        }

        function updateProgressUI() {
            progressText.textContent = `${completedLessons.size}/${lessons.length}`;
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            } else if (type === 'warning') {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-amber-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Mobile Sidebar Controls
        function openMobileSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeMobileSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        // Event Listeners Setup
        function setupEventListeners() {
            // Live Update on Editor Input
            htmlEditor.addEventListener('input', () => {
                updateLivePreview();
                updateCharCount();
            });
            cssEditor.addEventListener('input', () => {
                updateLivePreview();
                updateCharCount();
            });

            // Tabs Switch
            tabHtml.addEventListener('click', () => switchTab('html'));
            tabCss.addEventListener('click', () => switchTab('css'));

            // Reset Code Button
            document.getElementById('btn-reset').addEventListener('click', () => {
                const lesson = lessons[currentLessonIndex];
                htmlEditor.value = lesson.html;
                cssEditor.value = lesson.css;
                updateLivePreview();
                updateCharCount();
                showToast('Mã đã được đặt lại ban đầu!', 'info');
            });

            // Copy Code Button
            document.getElementById('btn-copy').addEventListener('click', () => {
                const content = activeTab === 'html' ? htmlEditor.value : cssEditor.value;
                const area = document.createElement('textarea');
                area.value = content;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                document.body.removeChild(area);
                showToast(`Đã chép mã ${activeTab.toUpperCase()} vào khay nhớ tạm!`, 'success');
            });

            // Download File
            document.getElementById('btn-download').addEventListener('click', () => {
                const html = htmlEditor.value;
                const css = cssEditor.value;
                const fullContent = `<!DOCTYPE html>\n<html>\n<head>\n<style>\n${css}\n</style>\n</head>\n<body>\n${html}\n</body>\n</html>`;

                const blob = new Blob([fullContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `bai-hoc-${currentLessonIndex + 1}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Đã tải xuống file bài học!', 'success');
            });

            // Refresh preview frame
            document.getElementById('btn-refresh-preview').addEventListener('click', () => {
                updateLivePreview();
                showToast('Đã làm mới màn hình xem trước', 'info');
            });

            // Toggle Mark Complete
            btnMarkComplete.addEventListener('click', toggleCompleteCurrentLesson);

            // Mobile Navigation
            document.getElementById('toggle-sidebar-btn').addEventListener('click', openMobileSidebar);
            document.getElementById('close-sidebar-btn').addEventListener('click', closeMobileSidebar);
            sidebarOverlay.addEventListener('click', closeMobileSidebar);

            // Support Tab key in Textareas for formatting
            [htmlEditor, cssEditor].forEach(editor => {
                editor.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = editor.selectionStart;
                        const end = editor.selectionEnd;
                        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
                        editor.selectionStart = editor.selectionEnd = start + 2;
                        updateLivePreview();
                    }
                });
            });
        }

        // Kickstart on DOM Ready
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
